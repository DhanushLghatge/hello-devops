trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

# 🔐 VARIABLES (Key Vault simulation)
variables:
  DB_PASSWORD: "12345"

stages:

# ------------------ BUILD STAGE ------------------
- stage: Build
  displayName: "Build Stage"
  jobs:
  - job: BuildJob
    displayName: "Build Job"
    steps:

    - script: echo "📦 Starting Build Process..."
      displayName: "Start Build"

    - script: |
        echo "Running Maven Build..."
        echo "mvn clean install"
      displayName: "Maven Build"

    - script: |
        echo "Creating artifact..."
        mkdir output
        echo "Sample build file" > output/app.txt
      displayName: "Create Artifact"

    - script: echo "✅ Build Completed Successfully"
      displayName: "Build Complete"

# ------------------ DEPLOY STAGE ------------------
- stage: Deploy
  displayName: "Deploy Stage"
  dependsOn: Build
  jobs:
  - job: DeployJob
    displayName: "Deploy Job"
    steps:

    - script: echo "🚀 Starting Deployment..."
      displayName: "Start Deployment"

    - script: |
        echo "Deploying application to server..."
        echo "Artifact deployed successfully"
      displayName: "Deploy Application"

    # 🔐 Using Variable
    - script: |
        echo "Using secret variable..."
        echo "DB_PASSWORD = $(DB_PASSWORD)"
      displayName: "Use Secret"

    - script: echo "🎉 Deployment Completed Successfully"
      displayName: "Deployment Complete"